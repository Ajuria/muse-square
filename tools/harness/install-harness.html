<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harnais — MSInstall (section Compte + bandelette)</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:24px;color:#111827} :root{--ms-bb-h:74px} .bb{position:fixed;left:0;right:0;bottom:0;height:74px;background:#fff;border-top:1px solid rgba(17,24,39,.1);display:flex;align-items:center;justify-content:space-around;font-size:11px;letter-spacing:.08em} h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;margin:24px 0 12px} .ctl button{margin-right:8px}</style>
</head><body>

<section id="ms-install-section" hidden><h2>L'application Muse Square</h2><div id="ms-install-mount"></div></section>
<div id="ms-install-strip" hidden></div>

<script src="/public/js/install-app.js"></script>
<script>
  MSInstall.mountButton(document.getElementById("ms-install-mount"), { section: document.getElementById("ms-install-section") });
  MSInstall.mountStrip(document.getElementById("ms-install-strip"), { icon: "/public/icons/pwa/icon-192.png" });
</script>
</body></html>
