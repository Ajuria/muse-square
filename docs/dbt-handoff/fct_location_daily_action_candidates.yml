version: 2

models:
  - name: fct_location_daily_action_candidates
    description: >
      Scan quotidien de situation produisant des action cards par location.
      Grain : suppression_key (date × location_id × action_type, dédupliqué).
      30 types d'action distincts — inclut le passthrough change_feed_actions
      dont les action_type sont dynamiques (issus de change_subtype).
    data_tests:
      - unique:
          column_name: suppression_key
    columns:
      - name: date
        tests: [not_null]
      - name: location_id
        tests: [not_null]
      - name: action_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [
                  'audience_shift_opportunity',
                  'best_day_of_week',
                  'calendar_audience_shift',
                  'client_dormant',
                  'commercial_event_match',
                  'competition_pressure_spike',
                  'competition_proximity',
                  'competitor_audience_conflict',
                  'competitor_event_ending',
                  'competitor_event_launch',
                  'competitor_hours_change',
                  'competitor_new_offering',
                  'competitor_offering_removed',
                  'competitor_positioning_brief',
                  'competitor_positioning_gap',
                  'competitor_price_drop',
                  'competitor_price_increase',
                  'competitor_repricing_event',
                  'competitor_reputation_strength',
                  'competitor_threat_direct',
                  'day_opportunity',
                  'extended_bad_weather',
                  'foreign_tourism_signal',
                  'ft_peak_bad_weather',
                  'ft_peak_low_comp',
                  'ft_peak_mobility',
                  'ft_peak_saturated',
                  'ft_peak_tourism_vacation',
                  'ft_quiet_good_weather',
                  'high_competition_density',
                  'holiday_high_comp',
                  'hour_share_move',
                  'item_share_move',
                  'low_competition_window',
                  'mega_event_activation',
                  'mega_event_end',
                  'mobility_comp_squeeze',
                  'mobility_disruption',
                  'mobility_disruption_resolved',
                  'monthly_sales_hole',
                  'monthly_sales_spike',
                  'offering_mix_shift',
                  'proven_action_replication',
                  'regime_c_warning',
                  'review_solicitation',
                  'sales_competition_cannibalization',
                  'sales_discount_no_lift',
                  'sales_revenue_down_wow',
                  'sales_surge',
                  'sales_traffic_not_converting',
                  'sales_underperformance',
                  'same_bucket_saturation',
                  'top_day_approaching',
                  'weather_comp_opportunity',
                  'weather_hazard_onset',
                  'weather_improved',
                  'weather_window',
                  'weather_window_after_bad',
                  'weekend_opportunity',
                  'weekend_vacation_low_comp',
                  'weekly_briefing',
                  'weekly_sales_hole',
                  'weekly_sales_spike'
                ]
              config:
                severity: warn
      - name: action_priority
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2
                max_value: 4
                inclusive: true
      - name: action_category
        tests: [not_null]
      - name: channel_hint
        tests: [not_null]
      - name: headline_fr
        tests: [not_null]
      - name: data_payload
        tests: [not_null]
      - name: suppression_key
        tests: [not_null]
      - name: expires_at
        tests: [not_null]