<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proto — Piloter · Opérations en cours (cartes, pas des rangées)</title>
<style>
  body { margin:0; background:#F6F7F9; font-family:-apple-system,system-ui,"Segoe UI",sans-serif; color:#111827; }
  .wrap { max-width:780px; margin:26px auto 70px; padding:0 16px; }
  .eb { font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:rgba(17,24,39,0.45); font-weight:600; margin:0 0 8px; }
  .hero { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
  .tile { background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:14px; padding:13px 15px; box-shadow:0 1px 2px rgba(16,24,40,0.04); }
  .tile .k { font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:#9CA3AF; font-weight:600; }
  .tile .n { font-size:23px; font-weight:700; margin-top:5px; letter-spacing:-0.01em; }
  .tile .s { font-size:11px; color:#6B7280; margin-top:3px; }
  .ops { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
  .op { background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:14px; padding:14px 16px 12px; box-shadow:0 1px 2px rgba(16,24,40,0.04); display:flex; flex-direction:column; gap:8px; }
  .op .head { display:flex; align-items:flex-start; gap:8px; }
  .op .t { font-size:13.5px; font-weight:650; line-height:1.3; flex:1; min-width:0; }
  .chip { font-size:10.5px; font-weight:600; border-radius:20px; padding:2px 9px; white-space:nowrap; }
  .op .body { display:flex; align-items:center; gap:14px; }
  .op .meta { flex:1; min-width:0; font-size:11.5px; color:#6B7280; line-height:1.55; }
  .op .foot { display:flex; align-items:center; justify-content:space-between; border-top:1px solid #F3F4F6; padding-top:8px; margin-top:2px; }
  .cta { font-size:12.5px; font-weight:650; color:#1D3BB3; text-decoration:none; }
  .muted { font-size:11px; color:#9CA3AF; }
  .sim { position:absolute; top:10px; right:12px; }
  .op { position:relative; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eb" style="font-size:13px;color:#111827;text-transform:none;letter-spacing:0;">Piloter — proto « Opérations en cours » <span style="color:#9CA3AF;font-weight:400;">· données réelles + 2 états simulés (étiquetés)</span></p>

  <div class="hero" id="hero"></div>

  <p class="eb">Opérations en cours</p>
  <div class="ops" id="ops"></div>

  <div id="err" style="display:none;color:#B91C1C;padding:30px;text-align:center;font-size:13px;">Données introuvables — relancez scripts/piloter-ops-proto-harness.ts.</div>
</div>
<script src="piloter-ops-proto-data.js?v=4"></script>
<script>
(function () {
  var D = window.PILOTER_OPS;
  if (!D) { document.getElementById('err').style.display = 'block'; return; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function frI(n) { return Math.abs(Math.round(Number(n) || 0)).toLocaleString('fr-FR'); }
  function frD(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] : ''; }
  function dowFr(iso) { return ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][new Date(iso + 'T12:00:00Z').getUTCDay()]; }
  function daysTo(iso) { return Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(new Date().toISOString().slice(0,10) + 'T00:00:00Z')) / 86400000); }

  // ── Héros (chiffres réels du glance). ──
  var im = D.impact || {};
  document.getElementById('hero').innerHTML =
      '<div class="tile"><div class="k">Impact · 30 j</div><div class="n" style="color:#9CA3AF;">—</div><div class="s">inchangée (V7 réelle)</div></div>'
    + '<div class="tile"><div class="k">À faire</div><div class="n">—</div><div class="s">inchangée (V7 réelle)</div></div>'
    + '<div class="tile"><div class="k">Prochaine occasion</div><div class="n" style="color:#9CA3AF;">—</div><div class="s">inchangée (V7 réelle)</div></div>'
    + '<div class="tile"><div class="k">Veille</div><div class="n">' + (D.veille ? D.veille.n : 0) + '</div><div class="s">concurrents suivis · ' + (D.veille ? D.veille.offres : 0) + ' changements</div></div>';

  // ── Jauge : 3 états DESSINÉS. Avant fenêtre = arc pointillé + cible dans un badge daté
  //    (plus jamais une jauge grise vide qui a l'air cassée). ──
  var VC = { attente: '#1D3BB3', vert: '#059669', orange: '#B45309', rouge: '#b91c1c' };
  function fmtV(v, m) {
    if (v == null) return '—';
    if (m === 'conversion') return (v * 100).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' %';
    if (m === 'transactions') return Math.round(v).toLocaleString('fr-FR');
    return frI(v) + ' €';
  }
  function gauge(m) {
    var goal = m.goal != null ? m.goal : (m.baseline != null && m.value != null ? null : null);
    var col = m.realized == null ? '#9CA3AF'
      : (m.baseline != null && m.realized < m.baseline) ? VC.rouge
      : (m.goal != null ? (m.realized >= m.goal ? VC.vert : VC.orange) : VC.vert);
    var mx = Math.max(m.goal || 0, m.realized || 0, m.baseline || 0) * 1.12 || 1;
    function ang(v) { return Math.PI * (1 - Math.max(0, Math.min(1, v / mx))); }
    function gx(a, r) { return (70 + r * Math.cos(a)).toFixed(1); }
    function gy(a, r) { return (64 - r * Math.sin(a)).toFixed(1); }
    var R = 48, g = '';
    if (m.realized == null) {
      // AVANT FENÊTRE : arc pointillé bleu clair (la mesure est ARMÉE, pas absente) + cible.
      g += '<path d="M 22 64 A 48 48 0 0 1 118 64" fill="none" stroke="#C7D2FE" stroke-width="10" stroke-linecap="round" stroke-dasharray="1,14"/>';
      if (m.goal != null) { var aG0 = ang(m.goal); g += '<line x1="' + gx(aG0, R - 8) + '" y1="' + gy(aG0, R - 8) + '" x2="' + gx(aG0, R + 8) + '" y2="' + gy(aG0, R + 8) + '" stroke="#1D3BB3" stroke-width="2.6"/>'; }
      g += '<text x="70" y="54" font-size="13.5" font-weight="700" fill="#1D3BB3" text-anchor="middle">cible ' + esc(fmtV(m.goal, m.metric)) + '</text>';
    } else {
      g += '<path d="M 22 64 A 48 48 0 0 1 118 64" fill="none" stroke="#F3F4F6" stroke-width="10" stroke-linecap="round"/>';
      if (m.realized > 0) g += '<path d="M 22 64 A 48 48 0 0 1 ' + gx(ang(m.realized), R) + ' ' + gy(ang(m.realized), R) + '" fill="none" stroke="' + col + '" stroke-width="10" stroke-linecap="round"/>';
      if (m.baseline != null) { var aB = ang(m.baseline); g += '<line x1="' + gx(aB, R - 7) + '" y1="' + gy(aB, R - 7) + '" x2="' + gx(aB, R + 7) + '" y2="' + gy(aB, R + 7) + '" stroke="#9CA3AF" stroke-width="1.8"/>'; }
      if (m.goal != null) { var aG = ang(m.goal); g += '<line x1="' + gx(aG, R - 8) + '" y1="' + gy(aG, R - 8) + '" x2="' + gx(aG, R + 8) + '" y2="' + gy(aG, R + 8) + '" stroke="#1D3BB3" stroke-width="2.6"/>'; }
      g += '<text x="70" y="52" font-size="15" font-weight="700" fill="' + col + '" text-anchor="middle" style="font-variant-numeric:tabular-nums;">' + esc(fmtV(m.realized, m.metric)) + '</text>'
        + '<text x="70" y="66" font-size="9.5" fill="#9CA3AF" text-anchor="middle">objectif ' + esc(fmtV(m.goal, m.metric)) + '</text>';
    }
    return '<svg viewBox="0 0 140 72" style="width:150px;height:auto;flex:none;">' + g + '</svg>';
  }

  // ── Cartes opérations : la réelle + 2 états simulés ÉTIQUETÉS (demande : voir la densité). ──
  var real = (D.mesures || [])[0];
  var ops = [];
  if (real) {
    var goalPct = real.basis === 'pct' && real.value != null ? real.value : null;
    ops.push({
      titre: String(real.texte || '').split('—')[0].trim(), site: 'Muse Square', sim: false,
      metric: real.metric, kpiLbl: 'CA famille « Branded »',
      realized: real.realized, baseline: real.baseline,
      goal: goalPct != null && real.baseline != null ? Math.round(real.baseline * (1 + goalPct / 100) * 10) / 10 : null,
      ws: real.ws, we: real.we, wsLbl: dowFr(real.ws) + ' ' + frD(real.ws),
      state: real.realized == null ? 'Armée · J-' + daysTo(real.ws) : 'En mesure',
      stateBg: '#EEF2FF', stateFg: '#1D3BB3',
      sub: 'Armée — la mesure démarre ' + dowFr(real.ws) + ' ' + frD(real.ws) + ' · verdict jugé automatiquement après le ' + frD(real.we),
    });
  }
  ops.push({
    titre: 'Coupon café glacé la veille des jours chauds', site: 'Occitanie', sim: true,
    metric: 'conversion', kpiLbl: 'taux de conversion',
    realized: 0.457, baseline: 0.43, goal: 0.516,
    state: 'Jour 4/7', stateBg: '#FEF3E2', stateFg: '#B45309',
    sub: 'Au-dessus de votre habituel, sous l’objectif — verdict vendredi',
  });
  ops.push({
    titre: 'Offre du samedi — mise en avant vitrine', site: 'MS Test', sim: true,
    metric: 'transactions', kpiLbl: 'tickets/jour',
    realized: 302, baseline: 273.6, goal: 300.9,
    state: 'Jour 6/7', stateBg: '#E6F6F0', stateFg: '#059669',
    sub: 'Objectif dépassé — verdict demain',
  });

  document.getElementById('ops').innerHTML = ops.map(function (o) {
    return '<div class="op">'
      + (o.sim ? '<span class="chip sim" style="background:#F3F4F6;color:#9CA3AF;">simulation</span>' : '')
      + '<div class="head"><div class="t">' + esc(o.titre) + '</div></div>'
      + '<div style="display:flex;gap:5px;flex-wrap:wrap;">'
      + '<span class="chip" style="background:' + o.stateBg + ';color:' + o.stateFg + ';">' + esc(o.state) + '</span>'
      + '<span class="chip" style="background:#F3F4F6;color:#6b7280;">' + esc(o.site) + '</span>'
      + '<span class="chip" style="background:#F8FAFC;color:#6b7280;border:0.5px solid #E5E7EB;">' + esc(o.kpiLbl) + '</span></div>'
      + '<div class="body">' + gauge(o) + '<div class="meta">' + esc(o.sub) + '</div></div>'
      + '<div class="foot"><span class="muted">' + (o.realized == null ? 'la mesure s’arme seule — rien à faire d’ici là' : 'mesuré sur vos ventes, jour par jour') + '</span>'
      + '<a class="cta" href="#">Ajuster →</a></div>'
      + '</div>';
  }).join('');
})();
</script>
</body>
</html>
