<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Fil Agir (corps réels · colonne € · médaillons)</title>
<style>
  /* FIL AGIR v2 — corps RÉELS (moteur action-cards.js exécuté au harnais) + les 6 leviers :
     € héros en colonne permanente triée par impact · médaillon-avatar 28px · filet « Nouveau » ·
     rangée de victoire · rythme d'espacement · micro-interactions (survol, compte-à-rebours €). */
  * { box-sizing: border-box; }
  body { margin: 0; background: #F9FAFB; font-family: system-ui, -apple-system, sans-serif; color: #111827; font-size: 13px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 90px; }
  .banner { font-size: 12px; color: #6B7280; background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; }
  .pill { font-size: 12px; font-family: inherit; padding: 6px 12px; border: 1px solid #E5E7EB; border-radius: 20px; background: #fff; color: #374151; cursor: pointer; }
  .pill.on { background: #EEF2FF; border-color: #1D3BB3; color: #1D3BB3; font-weight: 600; }
  .chip { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 8px; border-radius: 20px; white-space: nowrap; background: #F3F4F6; color: #6b7280; }

  .feed { background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 14px; overflow: hidden; }
  /* Rangée : [médaillon 44 · contenu · colonne € 120]. Padding généreux (levier 5). */
  .frow { display: grid; grid-template-columns: 46px minmax(0,1fr) 128px; gap: 0 14px; padding: 18px 20px 14px 16px; border-top: 1px solid rgba(17,24,39,0.06); transition: background 0.12s; }
  .frow:first-child { border-top: none; }
  .frow:hover { background: #FAFBFC; }
  .frow.mine { background: #F7F9FF; box-shadow: inset 2px 0 0 #1D3BB3; }
  .frow.mine:hover { background: #F2F5FF; }
  /* Médaillon-avatar (levier 2) : cercle neutre + glyphe famille ; anneau verdict si urgent. */
  .med { width: 30px; height: 30px; border-radius: 50%; background: #F4F5F7; display: flex; align-items: center; justify-content: center; margin: 2px auto 0; }
  .med svg { width: 15px; height: 15px; color: #6B7280; }
  .med.urgent { box-shadow: 0 0 0 2px #FDE68A; }
  .med.win { background: #E6F6F0; box-shadow: 0 0 0 2px #A7F3D0; }
  .med.win svg { color: #059669; }
  .fmeta { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .ftitle { font-size: 15.5px; font-weight: 650; color: #111827; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; letter-spacing: -0.01em; }
  .ftitle:hover { color: #1D3BB3; }
  .fbody { font-size: 13px; color: #374151; line-height: 1.65; margin-top: 7px; max-width: 58ch; }
  .fsrc { font-size: 11.5px; color: #9CA3AF; margin-top: 7px; }
  .foot { grid-column: 2 / 4; display: flex; align-items: center; gap: 16px; margin-top: 13px; }
  .foot .disp { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6B7280; }
  .facts { display: flex; gap: 18px; justify-content: flex-end; align-items: center; margin-left: auto; }
  /* Chantier STRUCTUREL compact (triage 26/07 : UNE ligne — titre chiffré + pool + pill + M'engager). */
  .str { display: grid; grid-template-columns: minmax(0,1fr) auto auto auto; gap: 0 12px; align-items: center; padding: 10px 16px; border-top: 1px solid #F3F4F6; font-size: 13px; }
  .str:first-child { border-top: none; }
  .str .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .str .pool { font-size: 11.5px; color: #9CA3AF; white-space: nowrap; }
  .facts .sec { background: none; border: none; padding: 0; font-family: inherit; font-size: 12.5px; font-weight: 500; color: #6B7280; cursor: pointer; }
  .facts .sec:hover { color: #374151; }
  .facts .pri { background: none; border: none; padding: 0; font-family: inherit; font-size: 12.5px; font-weight: 650; color: #1D3BB3; cursor: pointer; }
  .facts .pri:hover { text-decoration: underline; text-underline-offset: 3px; }
  /* Colonne € HÉROS (levier 1) : 19px tabulaire sur pastille teintée + mini-phrase. */
  .eur { text-align: right; align-self: start; display: flex; flex-direction: column; align-items: flex-end; }
  .eur .amt { display: inline-block; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; padding: 4px 10px; border-radius: 10px; animation: msFadeUp 0.35s ease; }
  @keyframes msFadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .eur .amt.gain { color: #059669; background: #ECFDF5; }
  .eur .amt.defend { color: #B45309; background: #FFF7ED; }
  .eur .mini { display: block; font-size: 11px; color: #6B7280; margin-top: 3px; }
  .eur .pending { display: inline-block; font-size: 11.5px; color: #9CA3AF; line-height: 1.4; text-align: right; cursor: help; }
  /* Filet « Nouveau » (levier 3). */
  .newline { display: flex; align-items: center; gap: 10px; padding: 4px 16px; color: #1D3BB3; font-size: 11.5px; font-weight: 600; }
  .newline::before, .newline::after { content: ""; flex: 1; height: 1px; background: #1D3BB3; opacity: 0.35; }
  /* Séparateur « aussi aujourd'hui ». */
  .alsoline { display: flex; align-items: center; gap: 10px; padding: 6px 16px; color: #9CA3AF; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
  .alsoline::before, .alsoline::after { content: ""; flex: 1; height: 1px; background: #F3F4F6; }
  .frow.compact { padding: 10px 16px 9px 14px; }
  .frow.compact .med { width: 22px; height: 22px; }
  .frow.compact .med svg { width: 12px; height: 12px; }
  .frow.compact .ftitle { font-size: 13.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="banner"><strong style="font-weight:600;">Maquette FIL AGIR v2</strong> — corps <strong style="font-weight:600;">réels</strong> (le vrai <code>action-cards.js</code> exécuté sur vos 13 cartes du <span id="pb-date"></span>). Colonne € permanente triée par impact · médaillons · filet « Nouveau » · rangée de victoire (votre +510 € mesuré du 04/07). Titre cliquable = Consulter la source.</div>
  <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
    <label style="font-size:12px;color:#374151;cursor:pointer;"><input type="checkbox" id="v-perim"> + cas simulé : question périmètre (place réservée)</label>
  </div>
  <div id="root"></div>
</div>

<script src="agir-proto-data.js?v=2"></script>
<script>
(function () {
  var D = window.AGIR_PROTO;
  var root = document.getElementById("root");
  if (!D || !D.cards) { root.innerHTML = '<div style="padding:30px;color:#B45309;font-size:14px;">Données introuvables — rechargez avec Cmd+Shift+R (cache).</div>'; return; }
  document.getElementById("pb-date").textContent = D.today.slice(8, 10) + "/" + D.today.slice(5, 7);
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function frInt(n) { return Math.abs(Math.round(Number(n) || 0)).toLocaleString("fr-FR"); }
  function frD(iso) { var d = String(iso || "").slice(0, 10); return d ? d.slice(8, 10) + "/" + d.slice(5, 7) : ""; }
  function trunc(s, n) { s = String(s || ""); if (s.length <= n) return s; var t = s.slice(0, n); var sp = t.lastIndexOf(" "); return (sp > n * 0.5 ? t.slice(0, sp) : t) + "…"; }

  // Glyphes famille (SVG inline — l'avatar du signal).
  var G = {
    weather: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.5 19a4.5 4.5 0 1 0-1.7-8.7 6 6 0 1 0-9.8 5.2"/><path d="M8 19h9.5"/></svg>',
    competitor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21V4h12l-2 4 2 4H4"/></svg>',
    sales: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
    opportunity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3"/></svg>',
    win: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21h8M12 17v4M17 5H7v5a5 5 0 0 0 10 0V5z"/><path d="M17 6h3a2 2 0 0 1-2 4M7 6H4a2 2 0 0 0 2 4"/></svg>',
  };
  function famOf(t) {
    if (/weather|bad_weather|ft_peak/.test(t)) return "weather";
    if (/competitor|competition|same_bucket|event_/.test(t)) return "competitor";
    if (/sales|revenue/.test(t)) return "sales";
    return "opportunity";
  }
  var svgAgir = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>';
  var svgCom = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

  // Tri = impact sur la bottom line : € gated d'abord (|€/an| décroissant), puis
  // « pas encore chiffré » (mesurable, historique en cours), puis « aussi aujourd'hui » (info).
  var MEASURABLE = /weather|bad_weather|competition_proximity|low_competition|same_bucket|ft_peak|sales/;
  function renderAll() {
  var seen = {}, main = [], also = [];
  (D.cards || []).forEach(function (c) {
    var k = c.action_type + "|" + (c.what || "");
    if (seen[k]) return; seen[k] = 1;
    if (c.enjeu && c.enjeu.eur_year != null) { c._prio = Math.abs(c.enjeu.eur_year); main.push(c); }
    else if (MEASURABLE.test(c.action_type) && c.enjeu_reason_fr) { c._prio = 0; main.push(c); }
    else also.push(c);
  });
  main.sort(function (a, b) { return b._prio - a._prio; });

  function eurCol(c) {
    var e = c.enjeu;
    if (e && e.eur_year != null) {
      var gain = true; // le montant récupérable est toujours un objectif — signe porté par la mini-phrase
      var mini = e.eur_year < 0 ? "à gagner" : "à défendre";
      var cls = e.eur_year < 0 ? "gain" : "defend";
      return '<span class="mini" style="margin-bottom:2px;">jusqu’à</span>'
        + '<span class="amt ' + cls + '" data-count="' + Math.abs(Math.round(e.eur_year)) + '" data-suffix=" €/an" title="' + esc((e.tier === "estimé" ? "estimé, cause multifactorielle" : "mesuré") + " · médiane sur vos " + e.n_days + " " + e.label_fr + " · jamais extrapolé") + '">' + frInt(e.eur_year) + ' €/an</span>'
        + '<span class="mini">' + mini + '</span>';
    }
    if (c.enjeu_reason_fr) return '<span class="pending" title="' + esc(c.enjeu_reason_fr) + '">pas encore chiffré<br>mûrit avec l’historique</span>';
    return "";
  }

  function row(c, compact) {
    var fam = famOf(c.action_type);
    var urgent = c.barClass === "ab-threat";
    var body = trunc(c.sowhat || "", 170);
    var e = c.enjeu;
    var source = e ? ((e.tier === "estimé" ? "estimé" : "mesuré") + " sur vos " + e.n_days + " " + e.label_fr + " · jamais extrapolé") : "";
    // CTA SOUS l'objectif € (owner 14/08) — la colonne droite = [montant · mini · gestes].
    return '<div class="frow' + (compact ? " compact" : "") + '">'
      + '<div><div class="med' + (urgent ? " urgent" : "") + '">' + G[fam] + '</div></div>'
      + '<div style="min-width:0;">'
      + '<div class="fmeta"><a href="#" class="ftitle" title="Consulter la source">' + esc(c.what || c.action_type) + '</a>'
      + '<span style="flex:1;"></span>' + (c.date && c.date !== D.today ? '<span class="chip">' + frD(c.date) + '</span>' : "") + '</div>'
      + (!compact && body ? '<div class="fbody">' + esc(body) + '</div>' : "")
      + (!compact && source ? '<div class="fsrc">' + esc(source) + '</div>' : "")
      + '</div>'
      + '<div class="eur">' + eurCol(c) + '</div>'
      + '<div class="foot"><div class="facts"><button type="button" class="sec" style="color:#B9BEC6;">Écarter</button><button type="button" class="sec">Communiquer</button><button type="button" class="pri">' + (c.needs_catchment ? "Répondre" : "M’engager") + '</button></div></div>'
      + '</div>';
  }

  // ── Rendu : victoire réelle → filet Nouveau → rangées chiffrées → aussi aujourd'hui. ──
  var html = '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px;">'
    + '<span style="font-size:20px;font-weight:650;">Vos actions du jour</span>'
    + '<span style="font-size:12.5px;color:#6B7280;">jeu ' + frD(D.today) + ' · <span style="color:#B45309;font-weight:600;">forte chaleur annoncée</span></span>'
    + '<span style="flex:1;"></span>'
    + '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#1D3BB3;background:#fff;border:1px solid #1D3BB3;border-radius:10px;padding:6px 10px;cursor:pointer;">Objectif de la semaine ▾</span>'
    + '<a href="#" style="color:#1D3BB3;font-weight:600;text-decoration:none;font-size:12.5px;">Piloter →</a></div>'
    // Les TROIS filtres du triage (doctrine validée 26/07 : Horizon / Nature / Tri enjeu — pas plus).
    + '<div style="display:flex;gap:8px;margin-bottom:14px;align-items:center;">'
    + '<button type="button" class="pill on">Aujourd’hui</button>'
    + '<button type="button" class="pill">Semaine</button>'
    + '<button type="button" class="pill">Structurel</button>'
    + '<span style="width:1px;height:18px;background:#E5E7EB;"></span>'
    + '<button type="button" class="pill">À défendre</button>'
    + '<button type="button" class="pill">À capter</button>'
    + '<span style="flex:1;"></span>'
    + '<button type="button" class="pill">Trier par enjeu</button>'
    + '</div>'
    // ── SECTION 1 : VOS ENGAGEMENTS — mêmes rangées que le fil (UN système), distinguées
    //    par la section, le médaillon et la chip d'état. Disposition à GAUCHE, CTA à DROITE. ──
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;"><span style="font-size:12px;font-weight:650;letter-spacing:0.07em;text-transform:uppercase;color:rgba(17,24,39,0.60);">Vos engagements</span><span style="font-size:11px;color:#9CA3AF;">2</span></div>'
    + '<div class="feed" style="margin-bottom:16px;">'
    + '<div class="frow mine">'
      + '<div><div class="med win">' + G.win + '</div></div>'
      + '<div style="min-width:0;">'
      + '<div class="fmeta"><a href="#" class="ftitle">Relancer une offre les jours de forte chaleur</a>'
      + '<span class="chip" style="background:#E6F6F0;color:#059669;font-weight:600;">objectif atteint</span>'
      + '<span style="flex:1;"></span><span class="chip">Muse Square Occitanie</span><span class="chip">04/07</span></div>'
      + '<div class="fbody">Votre engagement a tenu son objectif — écrivez la recette : elle devient un dispositif réutilisable.</div>'
      + '<div class="fsrc">mesuré vs votre résultat habituel sur la fenêtre engagée</div>'
      + '</div>'
      + '<div class="eur"><span class="amt gain">+510 €</span><span class="mini">repris · mesuré</span></div>'
      + '<div class="foot"><div class="disp">Action menée ?'
      + ' <button type="button" class="chip" style="cursor:pointer;background:#fff;border:1px solid #E5E7EB;">Oui</button>'
      + ' <button type="button" class="chip" style="cursor:pointer;background:#fff;border:1px solid #E5E7EB;">Pas encore</button></div>'
      + '<div class="facts"><button type="button" class="sec">Communiquer</button><button type="button" class="pri">Documenter</button></div></div>'
      + '</div>'
    + '<div class="frow mine">'
      + '<div><div class="med" style="background:#EEF2FF;"><svg viewBox="0 0 24 24" fill="none" stroke="#1D3BB3" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div></div>'
      + '<div style="min-width:0;">'
      + '<div class="fmeta"><a href="#" class="ftitle">Corner de vente producteur</a>'
      + '<span class="chip" style="background:#EEF2FF;color:#1D3BB3;font-weight:600;">démarre demain</span>'
      + '<span style="flex:1;"></span><span class="chip">sam 15/08</span></div>'
      + '<div class="fbody">La mesure s’arme seule le jour J — consigne et contexte gelés, l’équipe est prévenue. Verdict automatique samedi soir.</div>'
      + '<div class="fsrc">objectif famille Branded +11 %</div>'
      + '</div>'
      + '<div class="eur"><span class="pending">objectif +11 %<br>verdict sam soir</span></div>'
      + '<div class="foot"><div class="facts"><button type="button" class="sec">Communiquer</button><button type="button" class="pri">Ajuster</button></div></div>'
      + '</div>'
    + '</div>'
    // ── SECTION 2 : ACTIONS DU JOUR — les cartes SYSTÈME (le fil). ──
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;"><span style="font-size:12px;font-weight:650;letter-spacing:0.07em;text-transform:uppercase;color:rgba(17,24,39,0.60);">Actions du jour</span><span style="font-size:11px;color:#9CA3AF;" id="ap-count"></span></div>'
    + '<div class="feed">';
  // Place réservée QUESTION PÉRIMÈTRE (mécanique réelle needs_catchment — votre site a déjà
  // répondu « commune », la rangée est donc SIMULÉE ici pour montrer sa forme dans le fil).
  if (window.__simPerimetre) {
    html += '<div class="frow mine">'
      + '<div><div class="med" style="background:#EEF2FF;"><svg viewBox="0 0 24 24" fill="none" stroke="#1D3BB3" stroke-width="2" stroke-linecap="round"><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg></div></div>'
      + '<div style="min-width:0;">'
      + '<div class="fmeta"><span class="ftitle">Une question débloque vos cartes concurrence [simulé]</span></div>'
      + '<div class="fbody">D’où viennent vos clients ? Votre réponse fixe le rayon de lecture de la concurrence — et chiffre 4 cartes aujourd’hui muettes.</div>'
      + '<div class="facts" style="justify-content:flex-start;gap:8px;">'
      + '<button type="button" class="chip" style="cursor:pointer;background:#fff;border:1px solid #1D3BB3;color:#1D3BB3;font-weight:600;">Le quartier (1 km)</button>'
      + '<button type="button" class="chip" style="cursor:pointer;background:#fff;border:1px solid #1D3BB3;color:#1D3BB3;font-weight:600;">Toute la commune</button>'
      + '<button type="button" class="chip" style="cursor:pointer;background:#fff;border:1px solid #1D3BB3;color:#1D3BB3;font-weight:600;">Au-delà (20 km)</button>'
      + '</div></div><div class="eur"></div></div>';
  }
  // Levier 3 — filet Nouveau (réel au build : localStorage dernière visite ; ici : depuis hier).
  html += '<div class="newline">Nouveau depuis votre dernière visite</div>';
  main.forEach(function (c) { html += row(c, false); });
  if (also.length) {
    html += '<div class="alsoline">aussi aujourd’hui</div>';
    also.forEach(function (c) { html += row(c, true); });
  }
  html += '<div style="text-align:center;padding:14px;color:#9CA3AF;font-size:12px;">Vous êtes à jour — ' + (main.length + also.length) + ' cartes ce jour.</div>';
  html += '</div>';
  // ── SECTION 3 : CHANTIERS STRUCTURELS — format COMPACT du triage (26/07 : une ligne =
  //    titre chiffré + pool + pill registre + M'engager). Chiffres RÉELS du registre f10c3e58.
  html += '<div style="display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 6px;"><span style="font-size:12px;font-weight:650;letter-spacing:0.07em;text-transform:uppercase;color:rgba(17,24,39,0.60);">Chantiers structurels</span><span style="font-size:11px;color:#9CA3AF;">3</span></div>'
    + '<div class="feed">'
    + '<div class="str"><span class="t">Vos jours de pluie vous coûtent <span style="color:#B45309;font-weight:700;">~4 600 €/an</span></span><span class="pool">22 jours mesurés</span><span class="chip" title="cause multifactorielle — médiane du registre, jamais extrapolé">estimé</span><button type="button" class="pri" style="background:none;border:none;padding:0;font-family:inherit;font-size:12.5px;font-weight:650;color:#1D3BB3;cursor:pointer;">M’engager</button></div>'
    + '<div class="str"><span class="t">Vos vacances scolaires vous coûtent <span style="color:#B45309;font-weight:700;">~6 700 €/an</span></span><span class="pool">19 jours mesurés</span><span class="chip" title="cause multifactorielle — médiane du registre, jamais extrapolé">estimé</span><button type="button" class="pri" style="background:none;border:none;padding:0;font-family:inherit;font-size:12.5px;font-weight:650;color:#1D3BB3;cursor:pointer;">M’engager</button></div>'
    + '<div class="str"><span class="t">Vos jours de forte affluence rapportent <span style="color:#059669;font-weight:700;">~21 900 €/an</span></span><span class="pool">13 jours mesurés</span><span class="chip" title="à défendre — le motif joue pour vous">à défendre</span><button type="button" class="pri" style="background:none;border:none;padding:0;font-family:inherit;font-size:12.5px;font-weight:650;color:#1D3BB3;cursor:pointer;">M’engager</button></div>'
    + '</div>';
  root.innerHTML = html;
  }
  var perim = document.getElementById("v-perim");
  if (perim) perim.addEventListener("change", function (ev) { window.__simPerimetre = ev.target.checked; renderAll(); });
  renderAll();

  // Levier 6 — le € « arrive » en fondu CSS pur (keyframes, fill-mode none) : si
  // l'animation ne joue pas (onglet en pause), l'état NATUREL reste visible et exact.
