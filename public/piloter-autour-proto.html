<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proto — correctif des 8 points (héros, CTA, série, positionnement, dispositifs, automatisations)</title>
<style>
  body { margin:0; background:#F6F7F9; font-family:-apple-system,system-ui,"Segoe UI",sans-serif; color:#111827; }
  .wrap { max-width:820px; margin:24px auto 70px; padding:0 16px; }
  .fix { font-size:11px; font-weight:700; color:#fff; background:#111827; border-radius:6px; padding:2px 8px; display:inline-block; margin:22px 0 8px; }
  .eb { font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:rgba(17,24,39,0.45); font-weight:600; margin:0 0 8px; }
  .hero { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .tile { background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:12px; padding:12px 14px; box-shadow:0 1px 2px rgba(16,24,40,0.04); min-width:0; }
  .tile .k { font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:#9CA3AF; font-weight:600; }
  .tile .n { font-size:20px; font-weight:700; margin-top:5px; white-space:nowrap; overflow:hidden; }
  .tile .s { font-size:10.5px; color:#6B7280; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card { background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:12px; padding:14px 16px; box-shadow:0 1px 2px rgba(16,24,40,0.04); font-size:13px; line-height:1.6; }
  .li { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid #F5F6F8; font-size:12.5px; flex-wrap:wrap; }
  .li:first-of-type { border-top:none; }
  .cta { margin-left:auto; color:#1D3BB3; font-weight:650; font-size:12.5px; white-space:nowrap; text-decoration:none; }
  .chip { font-size:10.5px; font-weight:600; border-radius:20px; padding:2px 9px; white-space:nowrap; display:inline-flex; }
  .muted { color:#9CA3AF; font-size:11px; }
  .pos { font-size:11px; font-weight:600; border-radius:6px; padding:2px 7px; white-space:nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eb" style="font-size:13px;color:#111827;text-transform:none;letter-spacing:0;">Proto correctif — les 8 points, sur données réelles</p>
  <div id="root"></div>
  <div id="err" style="display:none;color:#B91C1C;padding:30px;text-align:center;">Données introuvables — relancez les deux harnais proto.</div>
</div>
<script src="piloter-autour-proto-data.js?v=4"></script>
<script src="piloter-full-proto-data.js?v=10"></script>
<script>
(function () {
  var D = window.AUTOUR_PROTO, F = window.PILOTER_FULL;
  if (!D || !F) { document.getElementById('err').style.display = 'block'; return; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function frI(n) { return Math.abs(Math.round(Number(n) || 0)).toLocaleString('fr-FR'); }
  function frD(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] : ''; }
  var AMBER = '#B45309', GREEN = '#059669', BLUE = '#1D3BB3', INK = '#111827', GREY = '#9CA3AF';
  var html = '';

  // ══ 1 · HÉROS — UN SEUL VERT (l'Impact, mesuré). Potentiel = encre, prospectif = bleu. ══
  html += '<span class="fix">Correctif 1 — couleurs</span><div class="hero">';
  (F.tiles || []).forEach(function (t) {
    var k = t.k.toUpperCase(), n = t.n, sub = t.s, col = INK;
    if (k.indexOf('IMPACT') === 0) col = GREEN;
    if (k.indexOf('À FAIRE') === 0) { col = INK; n = '+510 €'; sub = 'à prendre · 6 gestes en attente'; }
    if (k.indexOf('PROCHAINE') === 0) col = BLUE;
    if (k.indexOf('VEILLE') === 0) { col = INK; n = 'Rien n’a bougé'; sub = 'vos 5 suivis · lus cette nuit'; }
    var vert = k.indexOf('VEILLE') === 0 ? '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + GREEN + ';margin-right:6px;"></span>' : '';
    html += '<div class="tile"><div class="k">' + esc(t.k) + '</div><div class="n" style="color:' + col + ';' + (k.indexOf('VEILLE') === 0 ? 'font-size:14px;padding-top:4px;' : '') + '">' + vert + esc(n) + '</div><div class="s">' + esc(sub) + '</div></div>';
  });
  html += '</div>';

  // ══ 2 · À FAIRE — CTA = verbe seul, € avec son référentiel. ══
  html += '<span class="fix">Correctif 2 — CTA et montants</span><div class="card">';
  function verbOnly(g2) { var w = String(g2 || '').replace(/[«»"]/g, '').trim().split(/\s+/)[0].replace(/→/g, '').trim(); return w ? w + ' →' : '→'; }
  (F.afaire || []).slice(0, 4).forEach(function (r) {
    var eur = '';
    if (/510/.test(r.droite)) eur = '<span style="font-weight:700;">+510 €</span> <span class="muted">gagnés — à documenter</span>';
    else if (/150/.test(r.droite)) eur = '<span style="font-weight:700;">150 €</span> <span class="muted">cible</span>';
    html += '<div class="li"><span style="min-width:0;flex:1;"><span style="font-weight:600;">' + esc(r.titre) + '</span><span class="muted" style="display:block;">' + esc(r.sub) + '</span></span>'
      + (eur ? '<span style="white-space:nowrap;font-size:12.5px;">' + eur + '</span>' : '')
      + '<a class="cta" href="#">' + esc(verbOnly(r.geste)) + '</a></div>';
  });
  html += '</div>';

  // ══ 3 · SÉRIE — la légende NOMME ce qu'elle attend. ══
  html += '<span class="fix">Correctif 3 — frise de série</span><div class="card">';
  var serie = F.serie || { occ: [] };
  html += '<div style="font-weight:650;">Corner de vente producteur <span class="muted">· série</span></div>';
  (function () {
    var occ = serie.occ || [], n = occ.length, g = '', today = new Date().toISOString().slice(0, 10);
    function X(i) { return (14 + i * (300 / Math.max(1, n - 1))).toFixed(1); }
    g += '<line x1="10" y1="18" x2="318" y2="18" stroke="#E5E7EB" stroke-width="2"/>';
    occ.forEach(function (o, i) {
      var x = X(i);
      if (o.verdict === 'missed') g += '<circle cx="' + x + '" cy="18" r="7" fill="#b91c1c"/><text x="' + x + '" y="22" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">✗</text>';
      else if (o.verdict === 'met') g += '<circle cx="' + x + '" cy="18" r="7" fill="#059669"/><text x="' + x + '" y="22" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">✓</text>';
      else if (o.status === 'open' || o.status === 'pending') g += '<circle cx="' + x + '" cy="18" r="7" fill="none" stroke="#1D3BB3" stroke-width="2" stroke-dasharray="2,2.5"/>';
      else if (o.d <= today) g += '<circle cx="' + x + '" cy="18" r="6" fill="none" stroke="#9CA3AF" stroke-width="2"/>';
      else g += '<circle cx="' + x + '" cy="18" r="3.5" fill="#E5E7EB"/>';
      g += '<text x="' + x + '" y="40" font-size="8.5" fill="#9CA3AF" text-anchor="middle">' + frD(o.d) + '</text>';
    });
    html += '<svg viewBox="0 0 330 46" style="width:100%;max-width:360px;height:auto;">' + g + '</svg>';
  })();
  html += '<div class="muted" style="margin-top:6px;">✗ cible manquée · ✓ cible tenue · <b style="color:#6B7280;">○ passée sans mesure (la mesure du 15/08 a été annulée)</b> · ◌ dispositif actif — mesure au jour J · petits points = planifiées</div></div>';

  // ══ 4+5+6 · MON POSITIONNEMENT — COMPARATIF (vous = le référent), signaux NOMMÉS, zéro méta. ══
  html += '<span class="fix">Correctifs 4·5·6 — Mon positionnement</span><div class="card">';
  var fiches = (D.fiches || []).slice().sort(function (a, b) { return (b.note || 0) - (a.note || 0); });
  var notes = fiches.map(function (f) { return f.note; }).filter(function (v) { return v != null; }).sort();
  var medNote = notes.length ? notes[Math.floor(notes.length / 2)] : null;
  var AUD_FR = { tourists: 'touristes', families: 'familles', professionals: 'professionnels', local: 'locale', mixed: 'mixte', students: 'étudiants', seniors: 'seniors' };
  var mesAud = [D.mon_audience.a1, D.mon_audience.a2].filter(Boolean);
  html += '<div style="font-size:13px;">Votre public : <b>' + mesAud.map(function (a) { return AUD_FR[a] || a; }).join(' + ') + '</b></div>'
    + '<div class="li" style="font-size:10.5px;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.05em;border-top:none;"><span style="min-width:150px;">Suivi</span><span style="min-width:120px;">Public vs vous</span><span style="min-width:150px;">Réputation</span><span>Prix</span></div>';
  fiches.forEach(function (f) {
    var overlap = mesAud.indexOf(f.audience) >= 0 ? ['même public', '#FEF3E2', AMBER] : f.audience === 'mixed' ? ['partiellement commun', '#F3F4F6', '#6b7280'] : ['public différent', '#E6F6F0', GREEN];
    var _maxN = Math.max.apply(null, notes), _minN = Math.min.apply(null, notes);
    var repLbl = f.note == null ? null : f.note >= _maxN - 0.05 ? ['parmi les mieux notés', '#FEF3E2', AMBER]
      : f.note <= _minN + 0.05 ? ['le moins bien noté de vos suivis', '#F3F4F6', '#6b7280'] : ['dans la moyenne', '#F3F4F6', '#6b7280'];
    var rep = f.note == null ? '<span class="muted">pas encore relevée</span>'
      : '<span style="font-weight:700;">★ ' + String(f.note).replace('.', ',') + '</span> <span class="pos" style="background:' + repLbl[1] + ';color:' + repLbl[2] + ';">' + repLbl[0] + '</span>';
    var prix = f.p_min == null ? '<span class="muted">non publiés</span>'
      : '<span>' + String(f.p_min).replace('.', ',') + '–' + String(f.p_max).replace('.', ',') + ' €</span> <span class="pos" style="background:#F3F4F6;color:#6b7280;">' + (f.p_min >= 30 ? 'premium' : 'accessible') + '</span>';
    html += '<div class="li"><span style="min-width:150px;font-weight:650;">' + esc(String(f.nom).length > 26 ? String(f.nom).slice(0, 24) + '…' : f.nom) + '</span>'
      + '<span style="min-width:120px;"><span class="pos" style="background:' + overlap[1] + ';color:' + overlap[2] + ';">' + overlap[0] + '</span></span>'
      + '<span style="min-width:150px;">' + rep + '</span><span>' + prix + '</span>'
      + (f.url ? '<a class="cta" href="' + esc(f.url) + '" target="_blank" rel="noopener">Sa page →</a>' : '<span class="cta" style="color:#B45309;font-weight:500;font-size:11px;">page illisible — à réparer</span>') + '</div>';
  });
  var hautes = fiches.filter(function (f) { return f.note != null && f.note >= 4.5; }).map(function (f) { return String(f.nom).split(' - ')[0].replace('Musée national des arts asiatiques', 'Guimet').replace("Musée de l'Orangerie", 'l’Orangerie'); });
  html += '<div style="height:1px;background:#F5F6F8;margin:10px 0;"></div>';
  if (hautes.length) html += '<div class="li"><span style="width:8px;height:8px;border-radius:50%;background:' + AMBER + ';flex:none;"></span><span style="min-width:0;flex:1;"><b>' + esc(hautes.join(' et ')) + '</b> tiennent ★ ≥ 4,5 — regardez ce qu’ils mettent en avant sur leurs pages.</span><a class="cta" href="#">Comparer →</a></div>';
  html += '<div class="li"><span style="width:8px;height:8px;border-radius:50%;background:' + BLUE + ';flex:none;"></span><span style="min-width:0;flex:1;">Votre produit phare : <b>Dark chocolate Lg</b> — 3 % de votre CA. 3 suivis comparables sur ce terrain — voyez ce qu\u2019ils poussent en face.</span><a class="cta" href="#">Comparer →</a></div>'
    + '<div class="li" style="opacity:0.55;"><span style="width:8px;height:8px;border-radius:50%;background:' + AMBER + ';flex:none;"></span><span style="min-width:0;flex:1;"><b>[Nom du suivi]</b> mord sur votre offre — <span class="muted">sera NOMMÉ par le payload enrichi ; une ligne qui ne peut pas nommer ne s’affiche pas</span></span></div>';
  html += '</div>';

  // ══ 7 · VOS DISPOSITIFS — poignée + LE FAIT du dernier test + un geste par état. ══
  html += '<span class="fix">Correctif 7 — Vos dispositifs</span><div class="card">';
  (function () {
    var nP = (D.practices || []).filter(function (p) { return p.tier === 'prouvee'; }).length;
    var nE = (D.practices || []).filter(function (p) { return p.tier === 'ecartee'; }).length;
    var nT = (D.practices || []).filter(function (p) { return p.tier !== 'prouvee' && p.tier !== 'ecartee' && p.tier !== 'archivee'; }).length;
    html += '<div style="font-size:13px;margin-bottom:4px;">Vos manières de faire, jugées sur vos ventes — <b>' + nP + ' prouvée' + (nP > 1 ? 's' : '') + ' · ' + nT + ' en test · ' + nE + ' écartée' + (nE > 1 ? 's' : '') + '</b>. Prouvée = rejouable ; écartée = à ajuster avant de retester.</div>';
  })();
  var testBy = {};
  (D.tests || []).forEach(function (t) { testBy[t.practice_id] = t; });
  function kpiFmt(v, m) {
    if (v == null) return '—';
    if (m === 'conversion') return (v * 100).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' %';
    if (m === 'transactions') return Math.round(v).toLocaleString('fr-FR');
    return frI(v) + ' €';
  }
  var KPI_N = { transactions: 'tickets/jour', conversion: 'taux de conversion', revenue_residual: 'CA/j', family_revenue: 'CA famille/j' };
  function shortName(txt) {
    var t = String(txt || '').split('—')[0].split('(')[0].split(',')[0].trim();
    if (t.length <= 48) return t;
    var cut = t.slice(0, 48);
    return cut.slice(0, cut.lastIndexOf(' ')) + '…';
  }
  (D.practices || []).filter(function (p) { return p.tier !== 'archivee'; }).slice(0, 3).forEach(function (p) {
    var t = testBy[p.practice_id];
    var st = p.tier === 'prouvee' ? ['prouvé', '#E6F6F0', GREEN] : p.tier === 'ecartee' ? ['écarté', '#FEF3E2', AMBER] : ['en test', '#EEF2FF', BLUE];
    var fact = '';
    if (t && t.realized != null) {
      var goal = t.basis === 'pct' && t.value != null && t.baseline != null ? t.baseline * (1 + t.value / 100) : null;
      fact = 'Testé du ' + frD(t.ws) + ' au ' + frD(t.we) + ' — ' + (KPI_N[t.metric] || t.metric) + ' ' + kpiFmt(t.realized, t.metric)
        + (goal != null ? ' vs cible ' + kpiFmt(goal, t.metric) : '')
        + ' : ' + (t.verdict === 'met' ? 'cible tenue' : t.verdict === 'missed' ? 'cible manquée' : 'non concluant (facteur externe — vacances)');
    } else if (t && t.ws) fact = 'Test lancé — verdict après le ' + frD(t.we) + '.';
    else fact = 'Jamais testé — une exécution mesurée suffit.';
    html += '<div class="li" style="align-items:flex-start;"><span class="chip" style="background:' + st[1] + ';color:' + st[2] + ';margin-top:2px;">' + st[0] + '</span>'
      + '<span style="min-width:0;flex:1;"><span style="font-weight:650;" title="' + esc(p.text) + '">' + esc(shortName(p.text)) + '</span>'
      + '<span style="display:block;font-size:11.5px;color:#6B7280;">' + esc(fact) + '</span></span>'
      + (p.tier === 'prouvee' ? '<a class="cta" href="#">Automatiser →</a>'
         : (t && t.realized == null && t.ws ? '<span class="cta" style="color:#9CA3AF;font-weight:500;">verdict après le ' + frD(t.we) + '</span>'
         : '<a class="cta" href="#">Prouver →</a>')) + '</div>';
  });
  html += '<div style="height:1px;background:#F5F6F8;margin:10px 0;"></div><div class="eb">À transformer en dispositif</div><div class="muted" style="margin-bottom:2px;">Ces motifs chiffrés n\u2019ont pas encore de réponse chez vous — engagez-la, elle deviendra un dispositif.</div>';
  (D.learnings || []).slice(0, 3).forEach(function (l) {
    var pos = Number(l.eur_year) > 0;
    html += '<div class="li"><span style="font-weight:700;color:' + (pos ? GREEN : AMBER) + ';white-space:nowrap;">' + (pos ? '+' : '−') + frI(l.avg_gap_eur) + ' €/j</span>'
      + '<span style="min-width:0;flex:1;">' + (pos ? 'gagnés' : 'perdus') + ' ' + esc(l.label_fr) + ' <span class="chip" style="background:#F3F4F6;color:#6b7280;">' + esc(l.site_label) + '</span></span>'
      + (l.covered ? '<span class="chip" style="background:#E6F6F0;color:' + GREEN + ';">couvert</span>' : '<a class="cta" href="#">M’engager →</a>') + '</div>';
  });
  html += '</div>';

  // ══ 8 · AUTOMATISATIONS — la liste de ce qui tourne seul, pas un journal. ══
  html += '<span class="fix">Correctif 8 — Automatisations</span><div class="card">';
  html += '<div class="li"><span class="chip" style="background:#E6F6F0;color:' + GREEN + ';">active</span>'
    + '<span style="min-width:0;flex:1;"><span style="font-weight:650;">Corner de vente producteur</span>'
    + '<span style="display:block;font-size:11.5px;color:#6B7280;">Série hebdomadaire — prochaine mesure samedi 22/08 · dernier verdict : cible manquée (08/08)</span></span>'
    + '<a class="cta" href="#">Dossier →</a></div>';
  html += '<div class="li"><span class="chip" style="background:#E6F6F0;color:' + GREEN + ';">active</span>'
    + '<span style="min-width:0;flex:1;"><span style="font-weight:650;">Alerte concurrent sur vos jours d’opération</span>'
    + '<span style="display:block;font-size:11.5px;color:#6B7280;">2 alertes en surveillance sur 7 jours — la dernière : Orangerie le jour de votre Corner</span></span>'
    + '<a class="cta" href="#">Régler →</a></div>';
  html += '<div class="li" style="opacity:0.8;"><span class="chip" style="background:#F3F4F6;color:#6b7280;">possible</span>'
    + '<span style="min-width:0;flex:1;"><span style="font-weight:650;">Coupon café glacé — au signal chaleur</span>'
    + '<span style="display:block;font-size:11.5px;color:#6B7280;">Éligible : se lancerait seul quand la chaleur est annoncée (2 dispositifs éligibles)</span></span>'
    + '<a class="cta" href="#">Automatiser →</a></div>';
  html += '</div>';

  document.getElementById('root').innerHTML = html;
})();
</script>
</body>
</html>
