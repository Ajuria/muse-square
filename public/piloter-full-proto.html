<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proto — Piloter, page entière (3 variantes d'opérations)</title>
<style>
  body { margin:0; background:#F6F7F9; font-family:-apple-system,system-ui,"Segoe UI",sans-serif; color:#111827; }
  .wrap { max-width:800px; margin:24px auto 70px; padding:0 16px; }
  .eb { font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:rgba(17,24,39,0.45); font-weight:600; margin:18px 0 8px; }
  .hero { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .tile { background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:14px; padding:12px 14px; box-shadow:0 1px 2px rgba(16,24,40,0.04); cursor:pointer; transition:border-color .12s; position:relative; }
  .tile:hover { border-color:#C7D2FE; }
  .tile .k { font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#9CA3AF; font-weight:600; }
  .tile .n { font-size:21px; font-weight:700; margin-top:5px; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; }
  .tile .s { font-size:10.5px; color:#6B7280; margin-top:3px; }
  .tile .go { position:absolute; right:10px; top:10px; color:#C7D2FE; font-size:12px; }
  .ops { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .op { background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:14px; padding:14px 16px 12px; box-shadow:0 1px 2px rgba(16,24,40,0.04); display:flex; flex-direction:column; gap:8px; position:relative; }
  .op.wide { grid-column:1 / -1; }
  .op .t { font-size:13.5px; font-weight:650; line-height:1.3; }
  .chip { font-size:10.5px; font-weight:600; border-radius:20px; padding:2px 9px; white-space:nowrap; }
  .op .body { display:flex; align-items:center; gap:14px; }
  .op .meta { flex:1; min-width:0; font-size:11.5px; color:#6B7280; line-height:1.55; }
  .op .foot { display:flex; align-items:center; justify-content:space-between; border-top:1px solid #F3F4F6; padding-top:8px; }
  .cta { font-size:12.5px; font-weight:650; color:#1D3BB3; text-decoration:none; }
  .muted { font-size:11px; color:#9CA3AF; }
  .card { background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:14px; padding:14px 16px; box-shadow:0 1px 2px rgba(16,24,40,0.04); }
  .af { display:grid; grid-template-columns:54px minmax(0,1fr) auto auto; gap:0 12px; align-items:center; padding:8px 0; border-top:1px solid #F5F6F8; }
  .af:first-of-type { border-top:none; }
  .af .t2 { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .af .u2 { font-size:11.5px; color:#6B7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .rv { display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid #F5F6F8; font-size:13px; cursor:pointer; }
  .rv:first-of-type { border-top:none; }
  .rv .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .rv .lb { font-weight:600; white-space:nowrap; }
  .rv .rs { flex:1; min-width:0; color:#6B7280; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rb { background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:14px; padding:12px 14px; box-shadow:0 1px 2px rgba(16,24,40,0.04); cursor:pointer; transition:border-color .12s; }
  .rb.on { border-color:#1D3BB3; box-shadow:0 0 0 1px #1D3BB3 inset; }
  .rb .cv { float:right; color:#C7D2FE; font-size:11px; }
  /* Styles minimaux pour le MARKUP RÉEL des volets injecté dans le panneau. */
  #radar-panel .tb-link { color:#1D3BB3; font-weight:600; text-decoration:none; cursor:pointer; }
  #radar-panel .tb-chip { display:inline-flex; font-size:11px; padding:1px 8px; border-radius:20px; background:#F3F4F6; color:#6b7280; }
  #radar-panel .tb-eb { font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:rgba(17,24,39,0.45); font-weight:600; margin:0; }
  #radar-panel .tb-fold { display:none; margin-top:8px; padding:10px 12px; background:#F8FAFC; border-radius:8px; font-size:12px; line-height:1.6; color:#374151; }
  #radar-panel { font-size:13px; line-height:1.55; }
  .rb:hover { border-color:#C7D2FE; }
  .rb .hd { display:flex; align-items:center; gap:7px; font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:#6B7280; font-weight:600; }
  .rb .num { font-size:19px; font-weight:700; margin-top:6px; letter-spacing:-0.01em; }
  .rb .num .u { font-size:12px; font-weight:500; color:#6B7280; margin-left:4px; }
  .rb .rs2 { font-size:11px; color:#9CA3AF; margin-top:3px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  @media (max-width:640px) {
    #radar-b { grid-template-columns:repeat(2,1fr) !important; }
    .hero { grid-template-columns:repeat(2,1fr); }
    .ops { grid-template-columns:1fr; }
    .af { grid-template-columns:44px minmax(0,1fr) auto; }
    .af .cta-cell { grid-column: 2 / -1; justify-self:end; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;">
    <div style="font-size:16px;font-weight:700;">Tableau de bord <span style="font-size:11px;color:#9CA3AF;font-weight:400;">· proto page entière — données réelles (états rejoués étiquetés)</span></div>
    <span style="display:inline-flex;padding:7px 14px;border:1px solid #1D3BB3;border-radius:10px;font-size:12.5px;font-weight:500;color:#1D3BB3;">Nouvel événement</span>
  </div>

  <div class="hero" id="hero" style="margin-top:14px;"></div>
  <p class="eb">Opérations en cours</p>
  <div class="ops" id="ops"></div>
  <p class="eb">À faire</p>
  <div class="card" id="af"></div>
  <p class="eb">Autour de vous</p>
  <div id="radar-b" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;"></div>
  <div id="radar-panel" style="display:none;margin-top:10px;" class="card"></div>
  <div id="radar" style="display:none;"></div>
  <div id="err" style="display:none;color:#B91C1C;padding:30px;text-align:center;font-size:13px;">Données introuvables — relancez scripts/piloter-full-proto-harness.ts.</div>
</div>
<script src="piloter-full-proto-data.js?v=9"></script>
<script>
(function () {
  var D = window.PILOTER_FULL;
  if (!D) { document.getElementById('err').style.display = 'block'; return; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function frI(n) { return Math.abs(Math.round(Number(n) || 0)).toLocaleString('fr-FR'); }
  function frD(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] : ''; }
  function dowFr(iso) { return ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][new Date(iso + 'T12:00:00Z').getUTCDay()]; }
  function daysTo(iso) { return Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(new Date().toISOString().slice(0,10) + 'T00:00:00Z')) / 86400000); }

  // ── Héros : les 4 tuiles RÉELLES capturées (mêmes textes que la V7), période écrite + cliquables. ──
  var PERIOD = { 'IMPACT': '', 'À FAIRE': '', 'PROCHAINE OCCASION': 'prospectif', 'VEILLE': 'lus cette nuit' };
  document.getElementById('hero').innerHTML = (D.tiles || []).map(function (t) {
    var extra = Object.keys(PERIOD).filter(function (k) { return t.k.toUpperCase().indexOf(k) === 0 && PERIOD[k]; })[0];
    var n = t.n, sub = t.s;
    // Correctif 1 (validé) : l'argent d'abord, le compte en sous-ligne.
    if (t.k.toUpperCase().indexOf('À FAIRE') === 0) {
      var m510 = String(t.s).match(/([+\u2212-]?\s?\d[\d\u00a0 ]*€)/);
      if (m510) { n = ('+' + m510[1].replace('+', '').trim()); sub = 'à prendre · ' + t.n + ' gestes en attente'; }
      else { sub = t.n + ' gestes en attente'; }
    }
    // Correctif (owner 17/08) : Veille à 0 -> pas de gros zéro qui a l'air cassé, l'absence
    // se dit en toutes lettres ; la tuile reste (une grille à trou serait pire).
    if (t.k.toUpperCase().indexOf('VEILLE') === 0 && String(t.n).trim() === '0') {
      n = 'Rien n\u2019a boug\u00e9';
      sub = String(t.s).replace(/^rien n.a boug\u00e9 chez /i, '') || t.s;
      return '<div class="tile"><span class="go">→</span><div class="k">' + esc(t.k) + '</div><div class="n" style="font-size:15px;color:#059669;line-height:1.3;padding-top:5px;">' + esc(n) + '</div><div class="s">' + esc(sub) + (extra ? ' · ' + PERIOD[extra] : '') + '</div></div>';
    }
    return '<div class="tile"><span class="go">→</span><div class="k">' + esc(t.k) + '</div><div class="n">' + esc(n) + '</div><div class="s">' + esc(sub) + (extra ? ' · ' + PERIOD[extra] : '') + '</div></div>';
  }).join('');

  // ── Variante 1 : OCCURRENCE (jour même) — armée = arc pointillé + cible (validé). ──
  function gaugeOcc(m) {
    var col = m.realized == null ? '#1D3BB3'
      : (m.baseline != null && m.realized < m.baseline) ? '#b91c1c'
      : (m.goal != null ? (m.realized >= m.goal ? '#059669' : '#B45309') : '#059669');
    var mx = Math.max(m.goal || 0, m.realized || 0, m.baseline || 0) * 1.12 || 1;
    function ang(v) { return Math.PI * (1 - Math.max(0, Math.min(1, v / mx))); }
    function gx(a, r) { return (70 + r * Math.cos(a)).toFixed(1); }
    function gy(a, r) { return (64 - r * Math.sin(a)).toFixed(1); }
    var R = 48, g = '';
    if (m.realized == null) {
      g += '<path d="M 22 64 A 48 48 0 0 1 118 64" fill="none" stroke="#C7D2FE" stroke-width="10" stroke-linecap="round" stroke-dasharray="1,14"/>';
      if (m.goal != null) { var aG0 = ang(m.goal); g += '<line x1="' + gx(aG0, R - 8) + '" y1="' + gy(aG0, R - 8) + '" x2="' + gx(aG0, R + 8) + '" y2="' + gy(aG0, R + 8) + '" stroke="#1D3BB3" stroke-width="2.6"/>'; }
      g += '<text x="70" y="54" font-size="13.5" font-weight="700" fill="#1D3BB3" text-anchor="middle">cible ' + frI(m.goal) + ' €</text>';
    } else {
      g += '<path d="M 22 64 A 48 48 0 0 1 118 64" fill="none" stroke="#F3F4F6" stroke-width="10" stroke-linecap="round"/>'
        + '<path d="M 22 64 A 48 48 0 0 1 ' + gx(ang(m.realized), R) + ' ' + gy(ang(m.realized), R) + '" fill="none" stroke="' + col + '" stroke-width="10" stroke-linecap="round"/>';
      if (m.goal != null) { var aG = ang(m.goal); g += '<line x1="' + gx(aG, R - 8) + '" y1="' + gy(aG, R - 8) + '" x2="' + gx(aG, R + 8) + '" y2="' + gy(aG, R + 8) + '" stroke="#1D3BB3" stroke-width="2.6"/>'; }
      g += '<text x="70" y="54" font-size="15" font-weight="700" fill="' + col + '" text-anchor="middle">' + frI(m.realized) + ' €</text>';
    }
    return '<svg viewBox="0 0 140 72" style="width:148px;height:auto;flex:none;">' + g + '</svg>';
  }

  // ── Variante 2 : FENÊTRE MULTI-JOURS — « Jour 4/7 » + mini-courbe du KPI jour réelle. ──
  function sparkline(days, baseline, goal, upTo) {
    var pts = days.slice(0, upTo);
    var all = pts.map(function (p) { return p.v; }).concat(baseline != null ? [baseline] : [], goal != null ? [goal] : []);
    var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
    var span = (mx - mn) || 1; mn -= span * 0.15; mx += span * 0.15;
    function X(i) { return (8 + i * (164 / Math.max(1, days.length - 1))).toFixed(1); }
    function Y(v) { return (54 - (v - mn) / (mx - mn) * 46).toFixed(1); }
    var g = '';
    if (baseline != null) g += '<line x1="8" y1="' + Y(baseline) + '" x2="172" y2="' + Y(baseline) + '" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="4,3"/>';
    if (goal != null) g += '<line x1="8" y1="' + Y(goal) + '" x2="172" y2="' + Y(goal) + '" stroke="#1D3BB3" stroke-width="1.4" stroke-dasharray="3,3"/>'
      + '<text x="172" y="' + (Number(Y(goal)) - 3) + '" font-size="8" fill="#1D3BB3" text-anchor="end">objectif</text>';
    g += '<polyline points="' + pts.map(function (p, i) { return X(i) + ',' + Y(p.v); }).join(' ') + '" fill="none" stroke="#B45309" stroke-width="2"/>';
    var last = pts[pts.length - 1];
    g += '<circle cx="' + X(pts.length - 1) + '" cy="' + Y(last.v) + '" r="3" fill="#B45309"/>';
    return '<svg viewBox="0 0 180 60" style="width:172px;height:auto;flex:none;">' + g + '</svg>';
  }

  // ── Variante 3 : SÉRIE — frise d'occurrences réelle (✗ manquée / ● mesurée / ◌ dispositif actif / · planifiée). ──
  function frise(occ) {
    var g = '', n = occ.length;
    function X(i) { return (14 + i * (300 / Math.max(1, n - 1))).toFixed(1); }
    g += '<line x1="10" y1="18" x2="318" y2="18" stroke="#E5E7EB" stroke-width="2"/>';
    occ.forEach(function (o, i) {
      var today = new Date().toISOString().slice(0, 10);
      var x = X(i);
      if (o.verdict === 'missed') g += '<circle cx="' + x + '" cy="18" r="7" fill="#b91c1c"/><text x="' + x + '" y="22" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">✗</text>';
      else if (o.verdict === 'met') g += '<circle cx="' + x + '" cy="18" r="7" fill="#059669"/><text x="' + x + '" y="22" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">✓</text>';
      else if (o.status === 'open' || o.status === 'pending') g += '<circle cx="' + x + '" cy="18" r="7" fill="none" stroke="#1D3BB3" stroke-width="2" stroke-dasharray="2,2.5"/>';
      else if (o.d <= today) g += '<circle cx="' + x + '" cy="18" r="6.5" fill="#9CA3AF"><title>mesurée — en attente de verdict</title></circle>';
      else g += '<circle cx="' + x + '" cy="18" r="3.5" fill="#E5E7EB"/>';
      g += '<text x="' + x + '" y="40" font-size="8.5" fill="#9CA3AF" text-anchor="middle">' + frD(o.d) + '</text>';
    });
    return '<svg viewBox="0 0 330 46" style="width:100%;max-width:360px;height:auto;">' + g + '</svg>';
  }

  // Correctif 2 (validé) : une carte porte un NOM — poignée dérivée, texte complet en infobulle.
  function shortName(txt) {
    var t = String(txt || '').split('→')[0].split('—')[0].split(',')[0].trim();
    return t.length > 45 ? t.slice(0, 42) + '…' : t;
  }
  var ops = [];
  // 1. Réelle : occurrence armée du Corner.
  var real = (D.mesures || [])[0];
  if (real) {
    var goal1 = real.basis === 'pct' && real.value != null && real.baseline != null ? Math.round(real.baseline * (1 + real.value / 100) * 10) / 10 : null;
    ops.push({ wide: false, html:
      '<div class="t">' + esc(String(real.texte || '').split('—')[0].trim()) + '</div>'
      + '<div style="display:flex;gap:5px;flex-wrap:wrap;"><span class="chip" style="background:#EEF2FF;color:#1D3BB3;">Dispositif actif · J-' + daysTo(real.ws) + '</span><span class="chip" style="background:#F3F4F6;color:#6b7280;">Muse Square</span><span class="chip" style="background:#F8FAFC;color:#6b7280;border:0.5px solid #E5E7EB;">CA famille « Branded »</span></div>'
      + '<div class="body">' + gaugeOcc({ realized: real.realized, baseline: real.baseline, goal: goal1 }) + '<div class="meta">Occurrence du ' + dowFr(real.ws) + ' ' + frD(real.ws) + ' — la mesure démarre seule, verdict jugé après le ' + frD(real.we) + '.</div></div>'
      + '<div class="foot"><span class="muted">rien à faire d’ici là</span><a class="cta" href="#">Ajuster →</a></div>' });
  }
  // 2. Réelle rejouée : fenêtre 7 j conversion, tronquée au jour 4 (étiquetée).
  if (D.coupon && (D.coupon.kpi.daily || []).length >= 4) {
    var k = D.coupon.kpi;
    var upTo = 4;
    var cum = k.daily.slice(0, upTo).reduce(function (s, p) { return s + p.v; }, 0) / upTo;
    var dPt = (cum - k.goal) * 100;
    ops.push({ wide: false, html:
      '<div class="t" title="' + esc(D.coupon.texte || '') + '">' + esc(shortName(D.coupon.texte)) + '</div>'
      + '<div style="display:flex;gap:5px;flex-wrap:wrap;"><span class="chip" style="background:#FEF3E2;color:#B45309;">Jour ' + upTo + '/' + k.daily.length + '</span><span class="chip" style="background:#F3F4F6;color:#6b7280;">' + esc(D.coupon.site) + '</span><span class="chip" style="background:#F8FAFC;color:#6b7280;border:0.5px solid #E5E7EB;">taux de conversion</span></div>'
      + '<div class="body">' + sparkline(k.daily, k.baseline, k.goal, upTo)
      + '<div class="meta"><span style="font-size:16px;font-weight:700;color:#B45309;font-variant-numeric:tabular-nums;">' + (dPt >= 0 ? '+' : '−') + Math.abs(dPt).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' pt</span> <span style="color:#374151;">vs objectif</span>'
      + '<span style="display:block;font-size:10.5px;color:#9CA3AF;margin-top:2px;">moyenne ' + (cum * 100).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' % · provisoire — verdict au jour ' + k.daily.length + '</span></div></div>'
      + '<div class="foot"><span class="muted">état rejoué (données réelles) · mesuré jour par jour</span><a class="cta" href="#">Ajuster →</a></div>' });
  }
  // 3. Réelle : la SÉRIE Corner — frise des 8 occurrences (pleine largeur, règle « carte seule »).
  if (D.serie) {
    var jug = D.serie.occ.filter(function (o) { return o.verdict === 'met' || o.verdict === 'missed'; });
    var tenues = D.serie.occ.filter(function (o) { return o.verdict === 'met'; }).length;
    var next = D.serie.occ.filter(function (o) { return o.status === 'open' || o.status === 'pending'; })[0];
    ops.push({ wide: true, html:
      '<div class="t">' + esc(D.serie.titre) + ' <span style="font-size:11px;color:#9CA3AF;font-weight:400;">· série</span></div>'
      + '<div style="display:flex;gap:5px;flex-wrap:wrap;"><span class="chip" style="background:#F3F4F6;color:#6b7280;">' + jug.length + '/' + D.serie.occ.length + ' jugées · ' + tenues + ' tenue' + (tenues > 1 ? 's' : '') + '</span><span class="chip" style="background:#F3F4F6;color:#6b7280;">Muse Square</span><span class="chip" style="background:#F8FAFC;color:#6b7280;border:0.5px solid #E5E7EB;">cible ' + frI(D.serie.cible) + ' € · famille « ' + esc(D.serie.famille || '') + ' »</span></div>'
      + '<div class="body">' + frise(D.serie.occ)
      + '<div class="meta">Chaque occurrence est jugée seule — la série cumule les verdicts, jamais une moyenne. '
      + (next ? 'Prochaine : ' + dowFr(next.d) + ' ' + frD(next.d) + ' (dispositif actif).' : '') + '</div></div>'
      + '<div class="foot"><span class="muted">✗ manquée · ✓ tenue · ● grise = mesurée, verdict en attente · ◌ dispositif actif · petits points = planifiées</span><a class="cta" href="#">Dossier →</a></div>' });
  }
  document.getElementById('ops').innerHTML = ops.map(function (o) { return '<div class="op' + (o.wide ? ' wide' : '') + '">' + o.html + '</div>'; }).join('');

  // ── À faire : les 6 rangées RÉELLES capturées, resserrées. ──
  // Correctif 3 (validé) : le verbe au bouton, l'objet au titre. Correctif 8 : une forme
  // temporelle (relative), l'absolue en infobulle.
  function verbOnly(g2) {
    var w = String(g2 || '').replace(/[«»"]/g, '').trim().split(/\s+/)[0].replace(/\u2192/g, '').trim();
    return w ? w + ' \u2192' : '\u2192';
  }
  function quandSplit(q2) {
    var mRel = String(q2).match(/^(il y a \d+ j|J-\d+|auj\.)/);
    var rel = mRel ? mRel[1] : '';
    var abs = rel ? String(q2).replace(rel, '').trim() : String(q2).trim();
    return { rel: rel, abs: abs };
  }
  document.getElementById('af').innerHTML = (D.afaire || []).map(function (r) {
    var q2 = quandSplit(r.quand);
    var quandCell = q2.rel
      ? '<span style="font-size:10.5px;font-weight:700;color:#6B7280;line-height:1.3;cursor:help;" title="' + esc(q2.abs) + '">' + esc(q2.rel) + '</span>'
      : '<span style="display:flex;justify-content:center;"><span style="width:9px;height:9px;border-radius:50%;background:' + esc(r.dot || '#9CA3AF') + ';display:inline-block;"></span></span>';
    return '<div class="af">' + quandCell
      + '<span style="min-width:0;"><span class="t2" title="' + esc(r.titre) + '">' + esc(r.titre) + '</span><span class="u2" style="display:block;">' + esc(r.sub) + '</span></span>'
      + '<span style="font-size:12.5px;font-weight:600;white-space:nowrap;">' + esc(r.droite) + '</span>'
      + '<span class="cta cta-cell" style="white-space:nowrap;">' + esc(verbOnly(r.geste)) + '</span></div>';
  }).join('');

  // ── Radar : les 6 volets réels, fermés (résumés capturés). ──
  // ── Combinaison validée (owner 17/08) : la grille B est le RÉSUMÉ CLIQUABLE — chaque carte
  //    déplie le volet RÉEL (markup capturé de la vraie page) dans le panneau sous la grille.
  document.getElementById('radar-b').innerHTML = (D.volets || []).map(function (v, vi) {
    var seg = String(v.resume || '').split('·').map(function (x) { return x.trim(); }).filter(Boolean);
    var first = seg[0] || '';
    var mNum = first.match(/^([+\u2212-]?\d[\d\u00a0 ,\/]*)\s*(.*)$/);
    var num = mNum ? mNum[1].trim() : first, unit = mNum ? mNum[2] : '';
    var rest = seg.slice(1).join(' · ');
    return '<div class="rb" data-rb="' + vi + '"><span class="cv">\u25be</span><div class="hd"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:' + esc(v.dot || '#9CA3AF') + ';flex:none;"></span>' + esc(v.label) + '</div>'
      + '<div class="num">' + esc(num) + (unit ? '<span class="u">' + esc(unit) + '</span>' : '') + '</div>'
      + '<div class="rs2">' + esc(rest) + '</div></div>';
  }).join('');
  var panel = document.getElementById('radar-panel');
  var openIdx = -1;
  document.querySelectorAll('[data-rb]').forEach(function (card) {
    card.addEventListener('click', function () {
      var vi = Number(card.getAttribute('data-rb'));
      document.querySelectorAll('[data-rb]').forEach(function (c2) { c2.classList.remove('on'); });
      if (openIdx === vi) { openIdx = -1; panel.style.display = 'none'; panel.innerHTML = ''; return; }
      openIdx = vi;
      card.classList.add('on');
      var v = D.volets[vi];
      panel.style.display = 'block';
      panel.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:' + esc(v.dot) + ';"></span><span style="font-weight:650;font-size:13px;">' + esc(v.label) + '</span><span style="flex:1;"></span><button type="button" id="rp-close" style="background:none;border:none;color:#9CA3AF;font-size:12px;cursor:pointer;font-family:inherit;">fermer \u25b4</button></div>' + v.body_html;
      document.getElementById('rp-close').addEventListener('click', function (ev) { ev.stopPropagation(); openIdx = -1; panel.style.display = 'none'; panel.innerHTML = ''; card.classList.remove('on'); });
      // Les plis internes du volet réel (data-tb-fold) restent cliquables dans la maquette.
      panel.querySelectorAll('[data-tb-fold]').forEach(function (fb) {
        fb.addEventListener('click', function () { var t = panel.querySelector('#' + fb.getAttribute('data-tb-fold')); if (t) t.style.display = t.style.display === 'block' ? 'none' : 'block'; });
      });
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
})();
</script>
</body>
</html>
