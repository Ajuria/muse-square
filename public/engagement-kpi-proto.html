<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proto — KPI jour (D demi-cercle + C pairs) · 7 engagements réels</title>
<style>
  body { margin:0; background:#FAFAFA; font-family:-apple-system,system-ui,"Segoe UI",sans-serif; color:#111827; }
  .wrap { max-width:820px; margin:28px auto 60px; padding:0 16px; }
  h1 { font-size:16px; font-weight:700; margin:0 0 4px; }
  .sub { font-size:12px; color:#6B7280; margin-bottom:22px; }
  .card { background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:14px; padding:18px 20px 16px; margin-bottom:18px; }
  .head { display:flex; align-items:flex-start; gap:10px; justify-content:space-between; }
  .ttl { font-size:14.5px; font-weight:650; line-height:1.35; max-width:520px; }
  .meta { font-size:11.5px; color:#6B7280; margin-top:3px; }
  .pill { font-size:11px; font-weight:600; border-radius:999px; padding:3px 10px; white-space:nowrap; }
  .row { display:flex; gap:26px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .gz { flex:none; }
  .dots-wrap { flex:1; min-width:300px; }
  .dots-cap { font-size:10.5px; color:#9CA3AF; margin-top:4px; }
  .err { padding:30px; text-align:center; color:#B91C1C; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>KPI jour — D (demi-cercle) + C (points pairs)</h1>
  <div class="sub" id="cap">Vos 7 engagements réels, chacun mesuré dans SON KPI déclaré. Jauge = réalisé vs objectif ; points = les vrais jours de comparaison.</div>
  <div id="mount"><div class="err">Données introuvables — relancez scripts/engagement-kpi-proto-harness.ts puis rechargez.</div></div>
</div>
<script src="engagement-kpi-proto-data.js?v=3"></script>
<script>
(function () {
  var D = window.ENG_KPI_PROTO;
  if (!D || !D.engagements || !D.engagements.length) return;
  var mount = document.getElementById('mount');
  document.getElementById('cap').textContent = 'Vos ' + D.engagements.length + ' engagements réels, chacun mesuré dans SON KPI déclaré. Jauge = réalisé vs objectif ; points = les vrais jours de comparaison. Capture : ' + D.captured_at.slice(0, 10).split('-').reverse().join('/');

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  // Formats FR : virgule décimale, € après ; conversion (ratio 0-1) rendue en %.
  function frN(v, dec) { return Number(v).toLocaleString('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
  function fmt(v, m) {
    if (v == null) return '—';
    if (m === 'conversion') return frN(v * 100, 1) + ' %';
    if (m === 'transactions') return frN(v, 0);
    return frN(v, v < 100 ? 1 : 0) + ' €';
  }
  function unitLine(m) { return m === 'conversion' ? 'taux de conversion' : m === 'transactions' ? 'tickets/jour' : '€ par jour'; }
  function frDate(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] : ''; }

  // Couleur = POSITION mesurée (owner 15/08) : < habituel rouge ; [habituel, objectif[ orange ;
  // >= objectif vert. Sans objectif déclaré : l'habituel départage seul (rouge/vert).
  function bandColor(e) {
    if (e.realized == null) return '#9CA3AF';
    if (e.baseline != null && e.realized < e.baseline) return '#b91c1c';
    if (e.goal != null) return e.realized >= e.goal ? '#059669' : '#B45309';
    return '#059669';
  }
  function stateOf(e) {
    var col = bandColor(e);
    if (e.realized == null) return { col: col, pill: 'Avant fenêtre', pillBg: '#F3F4F6', pillFg: '#6B7280' };
    if (e.status === 'resolved') {
      // La pastille reste le verdict OFFICIEL stocké (machinerie d'époque) — l'arc, lui,
      // dit la position mesurée dans le KPI déclaré. Divergence = visible, jamais maquillée.
      var VC = { met: '#059669', missed: '#b91c1c' };
      var pc = VC[e.verdict] || '#B45309';
      var lbl = e.verdict === 'met' ? 'Objectif atteint' : e.verdict === 'missed' ? 'Objectif manqué' : 'Non concluant';
      return { col: col, pill: lbl, pillBg: pc + '18', pillFg: pc };
    }
    return { col: col, pill: 'En cours', pillBg: '#EEF2FF', pillFg: '#1D3BB3' };
  }

  // ── D : demi-cercle. Échelle 0 → max(objectif, réalisé, habituel) × 1,12 —
  //    un jour au-dessus de l'objectif DÉPASSE visiblement le repère, jamais d'arc plafonné. ──
  function gauge(e, st) {
    var mx = Math.max(e.goal || 0, e.realized || 0, e.baseline || 0) * 1.12 || 1;
    function ang(v) { return Math.PI * (1 - Math.max(0, Math.min(1, v / mx))); }
    function px(a, r) { return (160 + r * Math.cos(a)).toFixed(1); }
    function py(a, r) { return (150 - r * Math.sin(a)).toFixed(1); }
    var R = 106, s = '';
    s += '<path d="M 54 150 A 106 106 0 0 1 266 150" fill="none" stroke="#F3F4F6" stroke-width="20" stroke-linecap="round"/>';
    if (e.realized != null && e.realized > 0) {
      var aR = ang(e.realized);
      var large = (Math.PI - aR) > Math.PI ? 1 : 0;
      s += '<path d="M 54 150 A 106 106 0 ' + large + ' 1 ' + px(aR, R) + ' ' + py(aR, R) + '" fill="none" stroke="' + st.col + '" stroke-width="20" stroke-linecap="round"/>';
    }
    if (e.baseline != null) {
      var aB = ang(e.baseline);
      s += '<line x1="' + px(aB, R - 13) + '" y1="' + py(aB, R - 13) + '" x2="' + px(aB, R + 13) + '" y2="' + py(aB, R + 13) + '" stroke="#9CA3AF" stroke-width="2"/>';
      s += '<text x="' + px(aB, R + 24) + '" y="' + py(aB, R + 24) + '" font-size="9" fill="#9CA3AF" text-anchor="middle">habituel</text>';
    }
    if (e.goal != null) {
      var aG = ang(e.goal);
      s += '<line x1="' + px(aG, R - 14) + '" y1="' + py(aG, R - 14) + '" x2="' + px(aG, R + 14) + '" y2="' + py(aG, R + 14) + '" stroke="#1D3BB3" stroke-width="3"/>';
      s += '<text x="' + px(aG, R + 26) + '" y="' + py(aG, R + 26) + '" font-size="9.5" font-weight="650" fill="#1D3BB3" text-anchor="middle">objectif</text>';
    }
    var center, subCtr;
    if (e.realized == null) {
      center = '<text x="160" y="116" font-size="21" font-weight="700" fill="#9CA3AF" text-anchor="middle">—</text>';
      subCtr = e.goal != null ? 'cible ' + fmt(e.goal, e.metric) : 'objectif non déclaré';
    } else {
      center = '<text x="160" y="116" font-size="22" font-weight="700" fill="' + st.col + '" text-anchor="middle" style="font-variant-numeric:tabular-nums;">' + esc(fmt(e.realized, e.metric)) + '</text>';
      if (e.goal != null) {
        var d = e.realized - e.goal;
        var sgn = d >= 0 ? '+' : '−';
        var dv = Math.abs(e.metric === 'conversion' ? d * 100 : d);
        subCtr = sgn + frN(dv, dv < 10 ? 1 : 0) + (e.metric === 'conversion' ? ' pt' : e.metric === 'transactions' ? '' : ' €') + (d >= 0 ? ' au-dessus de' : ' sous') + ' l’objectif';
      } else { subCtr = 'sans objectif déclaré (ancien format)'; }
    }
    return '<svg viewBox="0 0 320 160" style="width:290px;height:auto;" role="img">'
      + s + center
      + '<text x="160" y="134" font-size="10.5" fill="#374151" text-anchor="middle">' + esc(subCtr) + '</text>'
      + '<text x="160" y="150" font-size="9.5" fill="#9CA3AF" text-anchor="middle">' + esc(e.label === unitLine(e.metric) ? e.label : e.label + (e.metric === 'conversion' ? '' : ' · ' + unitLine(e.metric))) + '</text>'
      + '</svg>';
  }

  // ── C : points sur échelle horizontale — pairs réels (jour) ou journées de la fenêtre. ──
  function dotsRow(e, st) {
    var pts = e.window.day_of ? e.peers : e.daily;
    var cap = e.window.day_of
      ? 'vos ' + pts.length + ' derniers ' + jourFr(e.window.start) + 's · gros point = le jour mesuré'
      : 'les ' + pts.length + ' journées de la fenêtre · la jauge = leur moyenne';
    var vals = pts.map(function (p) { return p.v; });
    if (e.realized != null && e.window.day_of) vals.push(e.realized);
    if (e.goal != null) vals.push(e.goal);
    if (e.baseline != null) vals.push(e.baseline);
    if (!vals.length) return '<div class="dots-cap">Pas encore de journées de comparaison.</div>';
    var mn = Math.min.apply(null, vals), mxv = Math.max.apply(null, vals);
    var span = (mxv - mn) || 1; mn -= span * 0.07; mxv += span * 0.07; span = mxv - mn;
    function X(v) { return (16 + (v - mn) / span * 388).toFixed(1); }
    var s = '<line x1="12" y1="26" x2="408" y2="26" stroke="#E5E7EB" stroke-width="2"/>';
    pts.forEach(function (p) { s += '<circle cx="' + X(p.v) + '" cy="26" r="3.4" fill="#D1D5DB"><title>' + esc(frDate(p.date) + ' · ' + fmt(p.v, e.metric)) + '</title></circle>'; });
    if (e.baseline != null) s += '<line x1="' + X(e.baseline) + '" y1="16" x2="' + X(e.baseline) + '" y2="36" stroke="#9CA3AF" stroke-width="1.6"/><text x="' + X(e.baseline) + '" y="10" font-size="8.5" fill="#9CA3AF" text-anchor="middle">habituel</text>';
    if (e.goal != null) s += '<line x1="' + X(e.goal) + '" y1="14" x2="' + X(e.goal) + '" y2="38" stroke="#1D3BB3" stroke-width="2.4"/><text x="' + X(e.goal) + '" y="50" font-size="9" font-weight="650" fill="#1D3BB3" text-anchor="middle">objectif</text>';
    if (e.realized != null && e.window.day_of) s += '<circle cx="' + X(e.realized) + '" cy="26" r="6.5" fill="' + st.col + '"><title>' + esc('le jour mesuré · ' + fmt(e.realized, e.metric)) + '</title></circle>';
    return '<svg viewBox="0 0 420 54" style="width:100%;height:auto;">' + s + '</svg><div class="dots-cap">' + esc(cap) + '</div>';
  }
  function jourFr(iso) {
    var j = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
    return j[new Date(iso + 'T00:00:00Z').getUTCDay()];
  }

  // ?skip=N : masque les N premières cartes (navigation par écran pour capture).
  var _skip = Number(new URLSearchParams(location.search).get('skip') || 0);
  var html = '';
  D.engagements.slice(_skip).forEach(function (e) {
    var st = stateOf(e);
    var win = e.window.day_of
      ? 'le ' + jourFr(e.window.start) + ' ' + frDate(e.window.start)
      : 'du ' + frDate(e.window.start) + ' au ' + frDate(e.window.end) + ' (' + e.window.days + ' j)';
    html += '<div class="card">'
      + '<div class="head"><div><div class="ttl">' + esc(e.text.length > 110 ? e.text.slice(0, 107) + '…' : e.text) + '</div>'
      + '<div class="meta">' + esc(e.site) + ' · ' + esc(win) + (e.owner ? ' · ' + esc(e.owner) : '') + '</div></div>'
      + '<span class="pill" style="background:' + st.pillBg + ';color:' + st.pillFg + ';">' + esc(st.pill) + '</span></div>'
      + '<div class="row"><div class="gz">' + gauge(e, st) + '</div>'
      + '<div class="dots-wrap">' + dotsRow(e, st) + '</div></div>'
      + '</div>';
  });
  mount.innerHTML = html;
})();
</script>
</body>
</html>
